services:
  - type: web
    name: tankyu-support-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 1 --threads 8 --timeout 300
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://oita-joho.github.io
      - key: TEXT_MODEL
        value: gemini-2.5-flash
      - key: IMAGE_MODEL
        value: gemini-3.1-flash-image
